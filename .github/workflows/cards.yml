name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

env:
  ACCENT: 7C3AED
  DARK_TEXT: c9d1d9
  LIGHT_TEXT: 24292f

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=00000000&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.DARK_TEXT }}
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=00000000&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.LIGHT_TEXT }}
          path: profile/stats-light.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=${{ env.ACCENT }}&text_color=${{ env.DARK_TEXT }}
          path: profile/langs-dark.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=${{ env.ACCENT }}&text_color=${{ env.LIGHT_TEXT }}
          path: profile/langs-light.svg
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
